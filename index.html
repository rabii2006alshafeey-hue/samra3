<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام إدارة المخزن</title>
<style>
  :root{
    --border:#ddd; --text:#111; --muted:#777; --danger:#d93026; --warn:#b45309;
  }
  *{box-sizing:border-box}
  body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#fafafa;color:var(--text);margin:0;padding:16px}
  .wrap{max-width:620px;margin:0 auto}
  h1{font-size:19px;font-weight:600;margin:0 0 12px}
  .stats{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .stat{flex:1;min-width:100px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:8px 12px}
  .stat .label{font-size:12px;color:var(--muted)}
  .stat .value{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
  .tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--border);background:#fff}
  .tab{flex:1;border:none;background:transparent;padding:10px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
  .tab.active{color:var(--text);border-bottom-color:var(--text)}
  .form{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  input{border:1px solid var(--border);border-radius:10px;padding:9px 12px;background:#fff;color:var(--text);outline:none;font-size:15px}
  input:focus{border-color:var(--text)}
  .form input{flex:1;min-width:90px}
  .search{width:100%;margin-bottom:12px}
  .btn{background:var(--text);color:#fff;border:none;border-radius:10px;padding:9px 20px;font-weight:600;cursor:pointer;font-size:15px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn-block{width:100%;padding:12px;margin-top:12px;font-size:16px}
  .row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:8px}
  .row .name{flex:2;font-weight:600;font-size:14px}
  .row .meta{flex:2;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:left}
  .row .meta b{color:var(--text)}
  .qty-ctl{display:flex;align-items:center;gap:6px}
  .qty-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-size:17px;line-height:1}
  .qty-num{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
  .del-btn{border:none;background:transparent;color:var(--danger);cursor:pointer;font-size:13px}
  .badge-low{font-size:11px;padding:2px 8px;border-radius:6px;background:#fef3c7;color:var(--warn)}
  .badge-out{font-size:11px;padding:2px 8px;border-radius:6px;background:#fee2e2;color:var(--danger)}
  .thumb{width:38px;height:38px;border-radius:8px;object-fit:cover;border:1px solid var(--border);flex-shrink:0}
  .thumb-ph{background:#eee;display:inline-block}
  .img-pick{display:flex;align-items:center;gap:8px;flex:1;min-width:140px}
  .img-pick label{font-size:13px;color:var(--muted);cursor:pointer;border:1px dashed var(--border);border-radius:10px;padding:8px 12px;white-space:nowrap}
  .img-pick input{display:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;position:relative}
  .card-img{width:100%;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--border);background:#eee}
  .card-name{font-weight:600;font-size:14px;min-height:20px}
  .card-price{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .card-price b{color:var(--text)}
  .card-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
  .card .del-btn{position:absolute;top:8px;left:8px;background:rgba(255,255,255,.9);border-radius:6px;padding:2px 6px}
  .card .badge-low,.card .badge-out{margin-right:4px}
  #login{position:fixed;inset:0;background:#fafafa;display:flex;align-items:center;justify-content:center;z-index:99}
  .login-box{background:#fff;border:1px solid var(--border);border-radius:16px;padding:28px 24px;width:100%;max-width:340px;text-align:center}
  .login-box h2{margin:0 0 6px;font-size:18px}
  .login-box p{font-size:13px;color:var(--muted);margin:0 0 16px}
  .login-box input{width:100%;margin-bottom:12px;text-align:center;font-size:16px;letter-spacing:2px}
  .login-err{color:var(--danger);font-size:13px;min-height:18px;margin:6px 0}
  .pass-btn{background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;text-decoration:underline;margin-top:8px}
  .hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .hdr h1{margin:0}
  .empty{text-align:center;color:var(--muted);padding:24px 0;font-size:14px}
  .cart-bar{display:flex;justify-content:space-between;align-items:center;padding:12px;background:#fff;border:1px solid var(--border);border-radius:10px;font-size:14px}
  .cart-bar .total{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
  .inv-head{font-size:13px;color:var(--muted)}
  .inv-lines{font-size:13px;color:#444;margin-top:4px}
  .inv-total{font-size:14px;margin-top:4px}
  @media(max-width:480px){.row .meta{display:none}}
</style>
</head>
<body>
<div id="login">
  <div class="login-box">
    <h2>مخزنك الخاص</h2>
    <p>أدخل كلمة المرور للمتابعة</p>
    <input id="passInput" type="password" placeholder="كلمة المرور" autocomplete="off">
    <div class="login-err" id="passErr"></div>
    <button class="btn btn-block" style="margin-top:0" id="loginBtn">دخول</button>
    <br><button class="pass-btn" id="resetPass">نسيت كلمة المرور؟</button>
  </div>
</div>

<div class="wrap" id="app" style="display:none">
  <div class="hdr">
    <h1>نظام إدارة المخزن</h1>
    <button class="pass-btn" id="changePass">تغيير كلمة المرور</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="label">الأصناف</div><div class="value" id="sItems">0</div></div>
    <div class="stat"><div class="label">الوحدات</div><div class="value" id="sUnits">0</div></div>
    <div class="stat"><div class="label">قيمة المخزون</div><div class="value" id="sValue">0</div></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="inv">المخزون</button>
    <button class="tab" data-tab="sale">عملية بيع</button>
  </div>

  <div id="tab-inv">
    <div class="form">
      <input id="fName" type="text" placeholder="اسم الصنف">
      <div class="img-pick">
        <label for="fImg">📷 صورة المنتج</label>
        <input id="fImg" type="file" accept="image/*">
        <img id="imgPrev" class="thumb" style="display:none">
      </div>
      <input id="fQty" type="number" min="1" placeholder="الكمية" style="max-width:80px">
      <input id="fPrice" type="number" min="0" placeholder="السعر" style="max-width:90px">
      <button class="btn" id="addBtn">إضافة</button>
    </div>
    <input class="search" id="search" type="text" placeholder="ابحث في المخزون...">
    <div class="grid" id="invList"></div>
  </div>

  <div id="tab-sale" style="display:none">
    <div id="saleList"></div>
    <div class="cart-bar"><span>إجمالي الفاتورة</span><span class="total" id="cartTotal">0.00</span></div>
    <button class="btn btn-block" id="checkoutBtn">إتمام البيع وطباعة الفاتورة</button>
  </div>

</div>

<script>
function getPass(){ return localStorage.getItem('store_pass') || '2006'; }
function unlock(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='';
  sessionStorage.setItem('unlocked','1');
}
if(sessionStorage.getItem('unlocked')==='1'){ unlock(); }
document.getElementById('loginBtn').addEventListener('click',function(){
  var v=document.getElementById('passInput').value;
  if(v===getPass()){ unlock(); }
  else{ document.getElementById('passErr').textContent='كلمة المرور غير صحيحة'; }
});
document.getElementById('passInput').addEventListener('keydown',function(e){
  if(e.key==='Enter'){ document.getElementById('loginBtn').click(); }
});
document.getElementById('changePass').addEventListener('click',function(){
  var cur=prompt('كلمة المرور الحالية:');
  if(cur!==getPass()){ alert('غير صحيحة'); return; }
  var nw=prompt('كلمة المرور الجديدة:');
  if(nw && nw.length>=4){ localStorage.setItem('store_pass',nw); alert('تم التغيير'); }
  else if(nw!==null){ alert('يجب ألا تقل عن 4 أحرف'); }
});
document.getElementById('resetPass').addEventListener('click',function(){
  alert('كلمة المرور الافتراضية: 2006\nيمكنك تغييرها بعد الدخول من زر "تغيير كلمة المرور" أعلى الصفحة.');
});

var items = [];
var cart = {};
var newImg = null;

function money(n){ return n.toFixed(2); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function save(){ localStorage.setItem('store_v1', JSON.stringify({items:items})); }
function load(){
  try{
    var d = JSON.parse(localStorage.getItem('store_v1'));
    if(d){ items=d.items||[]; }
  }catch(e){}
}

function render(){
  var u=0,v=0;
  items.forEach(function(it){ u+=it.qty; v+=it.qty*it.price; });
  document.getElementById('sItems').textContent=items.length;
  document.getElementById('sUnits').textContent=u;
  document.getElementById('sValue').textContent=money(v);
  renderInv(); renderSale(); save();
}
function badge(q){
  if(q===0) return ' <span class="badge-out">نفد</span>';
  if(q<=5) return ' <span class="badge-low">منخفض</span>';
  return '';
}
function renderInv(){
  var q=document.getElementById('search').value.trim();
  var list=document.getElementById('invList'); list.innerHTML='';
  var shown=items.map(function(it,i){return{it:it,i:i};}).filter(function(x){return !q||x.it.name.indexOf(q)!==-1;});
  if(!shown.length){ list.innerHTML='<div class="empty">لا توجد أصناف — أضف أول صنف</div>'; return; }
  shown.forEach(function(x){
    var d=document.createElement('div'); d.className='card';
    d.innerHTML=(x.it.img?'<img class="card-img" src="'+x.it.img+'">':'<div class="card-img"></div>')+
      '<div class="card-name">'+esc(x.it.name)+badge(x.it.qty)+'</div>'+
      '<div class="card-price">'+money(x.it.price)+' / وحدة<br><b>'+money(x.it.qty*x.it.price)+' · كمية: '+x.it.qty+'</b></div>'+
      '<div class="card-foot"><div class="qty-ctl">'+
      '<button class="qty-btn" data-scope="inv" data-act="minus" data-i="'+x.i+'">−</button>'+
      '<span class="qty-num">'+x.it.qty+'</span>'+
      '<button class="qty-btn" data-scope="inv" data-act="plus" data-i="'+x.i+'">+</button></div>'+
      '<button class="del-btn" data-scope="inv" data-act="del" data-i="'+x.i+'">حذف</button></div>';
    list.appendChild(d);
  });
}
function renderSale(){
  var list=document.getElementById('saleList'); list.innerHTML='';
  var any=false,total=0;
  items.forEach(function(it,i){
    var sel=cart[i]||0;
    if(sel>0){ any=true; total+=sel*it.price; }
    var d=document.createElement('div'); d.className='row';
    if(it.qty===0) d.style.opacity=.5;
    d.innerHTML=(it.img?'<img class="thumb" src="'+it.img+'">':'<span class="thumb thumb-ph"></span>')+
      '<div class="name">'+esc(it.name)+(it.qty===0?' <span class="badge-out">نفد</span>':'')+'</div>'+
      '<div class="meta">المتاح: '+it.qty+'</div>'+
      '<div class="qty-ctl">'+
      '<button class="qty-btn" data-scope="sale" data-act="minus" data-i="'+i+'"'+(sel===0?' disabled':'')+'>−</button>'+
      '<span class="qty-num">'+sel+'</span>'+
      '<button class="qty-btn" data-scope="sale" data-act="plus" data-i="'+i+'"'+(sel>=it.qty||it.qty===0?' disabled':'')+'>+</button></div>'+
      '<div class="meta" style="flex:1">'+(sel>0?'<b>'+money(sel*it.price)+'</b>':money(it.price)+' / وحدة')+'</div>';
    list.appendChild(d);
  });
  document.getElementById('cartTotal').textContent=money(total);
  document.getElementById('checkoutBtn').disabled=!any;
}

document.querySelector('.tabs').addEventListener('click',function(e){
  var t=e.target.closest('.tab'); if(!t) return;
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
  t.classList.add('active');
  ['inv','sale'].forEach(function(k){
    document.getElementById('tab-'+k).style.display=(k===t.dataset.tab)?'':'none';
  });
});
document.getElementById('fImg').addEventListener('change',function(){
  var f=this.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=320, w=img.width, hgt=img.height;
      if(w>max||hgt>max){ var s=max/Math.max(w,hgt); w=Math.round(w*s); hgt=Math.round(hgt*s); }
      var c=document.createElement('canvas'); c.width=w; c.height=hgt;
      c.getContext('2d').drawImage(img,0,0,w,hgt);
      newImg=c.toDataURL('image/jpeg',0.7);
      var p=document.getElementById('imgPrev'); p.src=newImg; p.style.display='';
    };
    img.src=r.result;
  };
  r.readAsDataURL(f);
});
document.getElementById('addBtn').addEventListener('click',function(){
  var name=document.getElementById('fName').value.trim();
  var qty=parseInt(document.getElementById('fQty').value,10);
  var price=parseFloat(document.getElementById('fPrice').value);
  if(!name||!(qty>0)||!(price>=0)) return;
  items.push({name:name,qty:qty,price:price,img:newImg});
  newImg=null;
  var p=document.getElementById('imgPrev'); p.src=''; p.style.display='none';
  document.getElementById('fImg').value='';
  document.getElementById('fName').value='';
  document.getElementById('fQty').value='';
  document.getElementById('fPrice').value='';
  render();
});
document.getElementById('search').addEventListener('input',renderInv);
document.getElementById('checkoutBtn').addEventListener('click',function(){
  var lines=[],total=0;
  Object.keys(cart).forEach(function(k){
    var i=parseInt(k,10),q=cart[k];
    if(q>0&&items[i]){
      lines.push({name:items[i].name,qty:q,price:items[i].price});
      total+=q*items[i].price;
      items[i].qty-=q;
    }
  });
  if(!lines.length) return;
  cart={};
  render();
  alert('تم إتمام البيع بمبلغ '+money(total));
});
document.querySelector('.wrap').addEventListener('click',function(e){
  var t=e.target.closest('[data-act]'); if(!t) return;
  var i=parseInt(t.dataset.i,10), act=t.dataset.act, scope=t.dataset.scope;
  if(scope==='inv'){
    if(act==='plus') items[i].qty++;
    if(act==='minus') items[i].qty=Math.max(0,items[i].qty-1);
    if(act==='del'){ items.splice(i,1); delete cart[i]; }
  }
  if(scope==='sale'){
    var cur=cart[i]||0;
    if(act==='plus'&&cur<items[i].qty) cart[i]=cur+1;
    if(act==='minus'&&cur>0){ if(cur===1) delete cart[i]; else cart[i]=cur-1; }
  }
  render();
});
load();
render();
</script>
</body>
</html>
